[pytest]
testpaths = tests
pythonpath = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show full assertion diffs and print captured output on failure
addopts = -v --tb=short

# Silence noisy third-party warnings from handcalcs / forallpeople
filterwarnings =
    ignore::DeprecationWarning:handcalcs
    ignore::DeprecationWarning:forallpeople
    ignore::UserWarning:forallpeople
