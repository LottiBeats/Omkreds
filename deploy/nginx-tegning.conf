# nginx-tegning.conf — tegneprogrammet på /tegning/, bag samme login som appen.
#
# Indsættes i server-blokken i /etc/nginx/sites-available/omkreds.dk.
# Den fil redigeres i hånden, ikke af deploy.sh — se noten nederst i
# deploy/deploy.sh om hvorfor nginx-konfigurationen ikke udrulles.
#
#   nginx -t && systemctl reload nginx
#
# ── Hvorfor ^~ og ikke bare / ────────────────────────────────────────────────
# Den eksisterende blok
#
#     location ~* \.(js|css|png|…)$ { expires 1y; }
#
# er et regulært udtryk, og et regulært udtryk slår et almindeligt præfiks i
# nginx' rækkefølge. Uden ^~ ville /tegning/script.js ryge derned, blive slået
# op i /opt/structuralcalc/app/frontend/dist, og give 404 — mens
# /tegning/index.html kom fint igennem. Siden ville indlæse og være tom.
# ^~ gør præfikset stærkere end regulære udtryk.

location ^~ /tegning/ {
    # Spørg backend'en først. Nginx udleverer ikke en eneste fil, før
    # /auth/gate har svaret 204.
    auth_request /_gate;

    # 401 og 403 skal ikke vises som en nginx-fejlside. Den, der ikke er logget
    # ind, skal sendes hen hvor man logger ind.
    error_page 401 403 = @tegning_login;

    alias /opt/structuralcalc/app/tegneprogram/;
    index index.html;

    # Programmet er ikke hashet som React-bundterne, så det må ikke caches
    # for evigt. En time er nok til at siden føles hurtig, og kort nok til at
    # en rettelse er ude samme formiddag.
    expires 1h;
    add_header Cache-Control "private, max-age=3600";
}

# Selve porten. internal betyder, at den ikke kan kaldes udefra — kun
# auth_request må nå den.
location = /_gate {
    internal;
    proxy_pass              http://127.0.0.1:8000/auth/gate;

    # auth_request sender altid GET uden krop; uden de to linjer sender nginx
    # en Content-Length videre, der ikke passer til noget.
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";

    # Cookien er hele pointen — det er den, porten læser.
    proxy_set_header        Host       $host;
    proxy_set_header        Cookie     $http_cookie;
    proxy_set_header        X-Real-IP  $remote_addr;
}

location @tegning_login {
    # Forsiden er der, hvor Clerk viser login. Efter login skal man selv gå
    # tilbage til /tegning/ — en retur-adresse ville kræve, at React-appen
    # kendte den, og det er mere maskineri end det er værd lige nu.
    return 302 /;
}
