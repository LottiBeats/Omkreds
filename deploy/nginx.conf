# /etc/nginx/sites-available/structuralcalc
# Replace YOUR_DOMAIN with your actual domain (e.g. calc.mycompany.com)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Certbot will add HTTPS redirect here automatically
    # when you run: certbot --nginx -d YOUR_DOMAIN

    root /opt/structuralcalc/app/frontend/dist;
    index index.html;

    # No body size limit — project JSON can contain multiple embedded images.
    # (Default Nginx limit is 1 MB which breaks image-heavy projects.)
    client_max_body_size 0;

    # API requests → FastAPI backend
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # All other requests → React SPA (handles its own routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
