# Modelindstillinger til byg_hbmodel.py. Geometrien kommer fra Rhino (geometri.json);
# alt det, der ikke er geometri, står her. Værdierne er udgangspunkter og skal
# erstattes med projektets opbygninger, når arkitekten leverer dem.

# Flader, hvis normal er tættere end denne vinkel på lodret, regnes som tag.
# A-husets tag har 62° hældning, så normalen står 62° fra lodret -> grænsen sættes til 70°.
tag_vinkel: 70
# Flader med alle hjørner under denne kote [m] får jord som randbetingelse.
terraen_kote: 0.01

konstruktioner:            # lag udefra og ind: [navn, tykkelse m, lambda W/mK, densitet kg/m3, varmefylde J/kgK]
  ydervaeg:
    - [traefiberplade, 0.022, 0.050, 250, 1600]
    - [mineraluld, 0.250, 0.037, 30, 840]
    - [gips, 0.013, 0.250, 900, 1000]
  tag:
    - [traefiberplade, 0.022, 0.050, 250, 1600]
    - [mineraluld, 0.350, 0.037, 30, 840]
    - [gips, 0.013, 0.250, 900, 1000]
  terraendaek:
    - [eps, 0.350, 0.037, 20, 1500]
    - [beton, 0.100, 1.700, 2300, 900]

glas:                      # lagnavn GLAS::<type> -> U [W/m2K], g [-], lystransmittans [-]
  3lag_g050: {u: 0.80, g: 0.50, lt: 0.71}
  3lag_g035: {u: 0.80, g: 0.35, lt: 0.60}
standard_glas: 3lag_g050

programmer:                # lagnavn RUM::<program>. Interne laster efter SBi-anvisning 213 (boliger)
  bolig:
    personer_w_m2: 1.5
    udstyr_w_m2: 3.5
    belysning_w_m2: 0.0
    infiltration_l_s_m2_facade: 0.10   # antagelse, skal kontrolleres
    friskluft_l_s_m2: 0.30             # BR18 § 443
    opvarmning_c: 20
standard_program: bolig

udluftning:                # vinduer åbnes, når det er varmt inde og køligere ude
  aabning_over_c: 24
  andel_oplukkelig: 0.5

skygge:
  traeer_transmittans: 0.5            # løvtræer, gennemsnit over året (forenkling)
