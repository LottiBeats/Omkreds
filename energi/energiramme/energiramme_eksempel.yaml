# Afsnittet  energiramme:  i projekt.yaml (kopiér det ind). Alt er valgfrit; standard står i
# energi/energiramme/be_model.py (STANDARD). Klimaskærmen kommer fra modellen.
energiramme:
  type: F                    # F fritliggende, S sammenbygget, E etagebolig, A andet end bolig
  varmekapacitet: 80         # Wh/K m² (let 40, middel 80, tung 120)
  brugstid: 168              # timer/uge (boliger 168)
  gulvvarme: true            # terrændæk og fundament regnes med 30 °C inde, 10 °C under gulv
  psi: {fundament: 0.15, vindue: 0.03, ovenlys: 0.10}
  rudeandel: 0.75            # FF, glasandel i vinduet
  skygge: {horisont: 10, vindueshul: 5}     # grader / %
  ventilation:
    qvm: 0.30                # mekanisk ventilation l/s m² (vinter)
    hvgv: 0.85               # varmegenvinding
    sel: 0.8                 # kJ/m³
    qid: 0.13                # infiltration l/s m²
    sommer_qvm: 0.30
    sommer_qid: 0.9          # udluftning om sommeren l/s m²
  intern: {personer: 1.5, udstyr: 3.5}
  forsyning: fjernvarme      # fjernvarme | luft_vand_varmepumpe | regneark (regnearkets eksempel)
  celler:                    # direkte felter i regnearket, fx varmepumpens data
    # "Hoved!D138": 6.0      # VP nominel effekt rumopvarmning, kW
    # "Hoved!D139": 3.8      # VP nominel COP
    # "Fordel!C58": 250      # varmt brugsvand, liter/år pr. m²
  udestaaende: []            # ekstra punkter til notatet
